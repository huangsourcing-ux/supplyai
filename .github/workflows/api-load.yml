name: API load baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load:
    name: k6 API baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run isolated API load baseline
        run: pnpm test:load

      - name: Upload load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-load-${{ github.sha }}
          path: .generated/load-results
          if-no-files-found: error
          retention-days: 30
