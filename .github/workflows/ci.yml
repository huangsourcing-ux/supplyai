name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  changes:
    name: Detect mobile changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.mobile.outputs.changed }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect mobile-affecting paths
        id: mobile
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
            apps/mobile \
            packages/api-client \
            packages/config \
            packages/geo \
            packages/i18n \
            packages/schemas \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            turbo.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Lint, typecheck, and unit tests
    runs-on: ubuntu-latest
    # Healthy runs finish in about two minutes; this still leaves ample runner
    # variance while failing a leaked five-minute Jest handle deterministically.
    timeout-minutes: 6
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated API artifacts
        run: pnpm api:generate:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

  build:
    name: Build Web and API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: local
      CLERK_SECRET_KEY: sk_test_ci_only_secret
      DATABASE_URL: postgresql://chinasupply:chinasupply_ci_only@127.0.0.1:5432/chinasupply
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_APP_ENV: local
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_only_publishable
      NEXT_PUBLIC_MAPTILER_KEY: ci_maptiler_key
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
      NEXT_PUBLIC_POSTHOG_KEY: phc_ci_only
      NEXT_PUBLIC_SENTRY_DSN: https://public@localhost/1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      PAYLOAD_SECRET: ci_only_payload_secret_at_least_32_chars
      R2_ACCESS_KEY_ID: ci_access_key
      R2_ACCOUNT_ID: ci_account
      R2_MEDIA_BUCKET: chinasupply-ci-media
      R2_CDN_BASE_URL: http://localhost:9000
      R2_PREFIX: dev
      R2_SECRET_ACCESS_KEY: ci_secret_key
      SENTRY_AUTH_TOKEN: ci_sentry_token
      SENTRY_ORG: replace_me
      SENTRY_PROJECT: chinasupply-web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web, API, and runtime workspace packages
        run: pnpm build

      - name: Start the compiled API under Node
        run: pnpm api:runtime:check

  api_e2e:
    name: API e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API e2e with Testcontainers
        run: pnpm test:e2e

  web_e2e:
    name: Web Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @chinasupply/web exec playwright install --with-deps chromium

      - name: Run deterministic Web Playwright suite
        run: pnpm test:web:e2e

      - name: Upload Web Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-failure-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report/fixture
            apps/web/test-results/fixture
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    name: Mobile PR checks
    needs:
      - changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    # The established job baseline is under three minutes. Six minutes catches
    # a default React Query five-minute GC handle before it looks like success.
    timeout-minutes: 6
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Mobile compatibility checks
        env:
          EXPO_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
          EXPO_PUBLIC_APP_ENV: local
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_only_publishable
        run: pnpm mobile:check

      - name: Mobile unit tests
        run: pnpm --filter @chinasupply/mobile test:unit

  ci_gate:
    name: CI Gate
    needs:
      - changes
      - quality
      - build
      - api_e2e
      - web_e2e
      - mobile
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          API_E2E_RESULT: ${{ needs.api_e2e.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          WEB_E2E_RESULT: ${{ needs.web_e2e.result }}
        shell: bash
        run: |
          [[ "$CHANGES_RESULT" == "success" ]]
          [[ "$QUALITY_RESULT" == "success" ]]
          [[ "$BUILD_RESULT" == "success" ]]
          [[ "$API_E2E_RESULT" == "success" ]]
          [[ "$WEB_E2E_RESULT" == "success" ]]
          [[ "$MOBILE_RESULT" == "success" || "$MOBILE_RESULT" == "skipped" ]]

  migrate_cms:
    name: Staging CMS migration
    needs:
      - ci_gate
    # `always()` prevents an allowed skipped Mobile job from propagating
    # through CI Gate and skipping this reusable workflow on main.
    if: always() && github.event_name == 'push' && needs.ci_gate.result == 'success'
    uses: ./.github/workflows/release-migrations.yml
    with:
      target: cms
      deployment_environment: staging
    secrets: inherit

  migrate_core:
    name: Staging Core migration
    needs:
      - migrate_cms
    if: always() && github.event_name == 'push' && needs.migrate_cms.result == 'success'
    uses: ./.github/workflows/release-migrations.yml
    with:
      target: core
      deployment_environment: staging
    secrets: inherit

  staging_release_gate:
    name: Staging Release Gate
    needs:
      - ci_gate
      - migrate_cms
      - migrate_core
    if: github.event_name == 'push' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require CI and migration success
        env:
          CI_GATE_RESULT: ${{ needs.ci_gate.result }}
          CMS_MIGRATION_RESULT: ${{ needs.migrate_cms.result }}
          CORE_MIGRATION_RESULT: ${{ needs.migrate_core.result }}
        shell: bash
        run: |
          [[ "$CI_GATE_RESULT" == "success" ]]
          [[ "$CMS_MIGRATION_RESULT" == "success" ]]
          [[ "$CORE_MIGRATION_RESULT" == "success" ]]
