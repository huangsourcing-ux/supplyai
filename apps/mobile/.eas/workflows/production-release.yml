name: Production Build and Submit

on:
  push:
    tags:
      - v*

jobs:
  approve_production:
    name: Approve production release
    type: require-approval

  build_android:
    name: Build Android Production
    needs:
      - approve_production
    type: build
    environment: production
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS Production
    needs:
      - approve_production
    type: build
    environment: production
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit Android Production
    needs:
      - build_android
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Submit iOS Production
    needs:
      - build_ios
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
