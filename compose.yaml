name: chinasupply

services:
  postgres:
    image: postgis/postgis:17-3.5
    # The upstream PostGIS image currently publishes amd64 only. Docker Desktop
    # uses its built-in emulation on Apple Silicon development machines.
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chinasupply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chinasupply_local_only}
      POSTGRES_USER: ${POSTGRES_USER:-chinasupply}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
